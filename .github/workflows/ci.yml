name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["[0-9]+.[0-9]+.[0-9]+", "[0-9]+.[0-9]+.[0-9]+-*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: go vet + go test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Wails v3 links GTK4/WebKitGTK 6.0 on Linux, also for vet and test
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      # go:embed needs frontend/dist, which only holds .gitkeep in git;
      # the OpenSSH comparison test uses the preinstalled ssh client.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      # frontend/bindings is generated from the Go service and committed
      - name: Check generated bindings
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          wails3 generate bindings -clean=true -i
          if [ -n "$(git status --porcelain frontend/bindings)" ]; then
            git status --short frontend/bindings
            echo "frontend/bindings is out of date: run 'wails3 generate bindings -clean=true -i'"; exit 1
          fi

  frontend:
    name: eslint + vitest
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
