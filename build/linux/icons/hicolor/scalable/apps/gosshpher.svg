<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- GoSSHpher app icon: terminal prompt + key on a rounded square.
       Export as 1024x1024 PNG to build/appicon.png, then run scripts/icons.py
       to derive build/windows/icon.ico and the Linux icon sizes. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26324f"/>
      <stop offset="1" stop-color="#121829"/>
    </linearGradient>
    <!-- one gradient along the whole key (local coordinates of the key group) -->
    <linearGradient id="key" gradientUnits="userSpaceOnUse" x1="-150" y1="0" x2="528" y2="0">
      <stop offset="0" stop-color="#5f8dff"/>
      <stop offset="1" stop-color="#b48cff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- body (macOS grid: 824px square, 100px margin) -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="3"/>

  <!-- terminal prompt  >_  -->
  <g fill="none" stroke="#e6ebf5" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="236,262 330,340 236,418"/>
    <line x1="376" y1="418" x2="476" y2="418"/>
  </g>

  <!-- key, pointing to the upper right -->
  <g transform="translate(392 640) rotate(-45)" fill="url(#key)">
    <path fill-rule="evenodd" d="M0,-150 A150,150 0 1,1 0,150 A150,150 0 1,1 0,-150 Z
                                 M0,-78 A78,78 0 1,0 0,78 A78,78 0 1,0 0,-78 Z"/>
    <rect x="110" y="-34" width="418" height="68" rx="20"/>
    <rect x="400" y="20" width="44" height="104" rx="12"/>
    <rect x="474" y="20" width="44" height="74" rx="12"/>
  </g>
</svg>
