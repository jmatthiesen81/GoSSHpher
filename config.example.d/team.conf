# Included by config.example ("Include config.example.d/*.conf").
# Open it from the Include line or from the "Effective" tab.

# One key per host: %h is replaced by the Hostname
Host ci-runner ci.example.net
  Hostname ci.example.net
  User ci
  IdentityFile ~/.ssh/work/%h

Host monitoring
  Hostname monitoring.example.net
  User ops
  LocalForward 3000 localhost:3000
